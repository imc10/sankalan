<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sankalan · Leave the run wizard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&amp;family=IBM+Plex+Sans+Devanagari:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6B6B}a:hover{color:#0A4F4F}
</style>
</helmet>
<div style="width: 1366px; height: 768px; position: relative; overflow: hidden; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; color: #1C2128">
<dc-import name="RunMapping" hint-size="1366px,768px"></dc-import>
<div style="position: absolute; left: 0; top: 0; width: 1366px; height: 768px; background: rgba(16, 24, 32, 0.45); display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" aria-labelledby="dlgTitle" style="width: 480px; box-sizing: border-box; background: #FFFFFF; border-radius: 12px; padding: 24px; box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2); display: flex; flex-direction: column; gap: 16px">
<h2 id="dlgTitle" style="margin: 0; font-size: 18px; font-weight: 500">Leave and discard this run?</h2><p style="margin: 0; font-size: 14px; line-height: 1.6; color: #444B55">Nothing has been loaded yet. Your mapping decisions for this run will be lost; the files stay where they are.</p><div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px"><button style="height: 36px; padding: 0 16px; border: 1px solid #D9DCE1; border-radius: 6px; background: #FFFFFF; color: #1C2128; font-family: inherit; font-size: 14px">Stay</button><button style="height: 36px; padding: 0 16px; border: 0; border-radius: 6px; background: #B42318; color: #FFFFFF; font-family: inherit; font-size: 14px; font-weight: 500">Discard run</button></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
