<main style="flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 20px 32px 0">

<nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5B636E; margin-bottom: 12px">
<a href="Main.dc.html" style="color: #0E6B6B; text-decoration: none">Clients</a>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8A9199" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg>
<a href="Client.dc.html" style="color: #0E6B6B; text-decoration: none">Shree Ganesh Enterprises</a>
<svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8A9199" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"></path></svg>
<span aria-current="page">New template</span>
</nav>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 24px; margin-bottom: 20px">
<h1 style="margin: 0; font-size: 22px; font-weight: 500; color: #1C2128">New template</h1>
<ol aria-label="Steps" style="list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 8px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<li aria-current="{{s.current}}" style="display: flex; align-items: center; gap: 8px">
<span style="width: 24px; height: 24px; border-radius: 12px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; background: {{s.dotBg}}; color: {{s.dotFg}}; border: 1px solid {{s.dotBorder}}">{{s.n}}</span>
<span style="font-size: 13px; font-weight: {{s.weight}}; color: {{s.fg}}">{{s.label}}</span>
<sc-if value="{{s.notLast}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="width: 16px; height: 1px; background: #D9DCE1; margin-left: 2px"></span></sc-if>
</li>
</sc-for>
</ol>
</div>

<section aria-label="Columns" style="flex: 1; min-height: 0; border: 1px solid #E6E8EB; border-radius: 8px; display: flex; flex-direction: column; overflow: hidden">
<div style="flex-shrink: 0; display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1.1fr) 120px minmax(0, 1fr) minmax(0, 1.4fr); column-gap: 16px; align-items: center; height: 40px; padding: 0 16px; background: #F8F9FA; border-bottom: 1px solid #E6E8EB; font-size: 12px; font-weight: 500; color: #5B636E">
<span>Include</span><span>Header in the file</span><span>Column name</span><span>Type</span><span>Detected</span><span>Sample values</span>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="10">
<div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) minmax(0, 1.1fr) 120px minmax(0, 1fr) minmax(0, 1.4fr); column-gap: 16px; align-items: center; height: 40px; padding: 0 16px; border-bottom: 1px solid #EEF0F2; font-size: 13px; font-variant-numeric: tabular-nums; color: {{c.fg}}">
<input type="checkbox" checked="{{c.on}}" aria-label="Include {{c.src}}" style="width: 16px; height: 16px; margin: 0; accent-color: #0E6B6B">
<span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.src}}</span>
<input type="text" value="{{c.name}}" aria-label="Column name for {{c.src}}" style="height: 30px; box-sizing: border-box; padding: 0 10px; border: 1px solid #D9DCE1; border-radius: 6px; font-family: inherit; font-size: 13px; color: {{c.fg}}; min-width: 0">
<select aria-label="Type for {{c.src}}" style="height: 30px; box-sizing: border-box; padding: 0 8px; border: 1px solid #D9DCE1; border-radius: 6px; font-family: inherit; font-size: 13px; color: {{c.fg}}; background: #FFFFFF"><option>{{c.type}}</option><option>Text</option><option>Number</option><option>Date</option></select>
<span style="font-size: 12px; color: {{c.noteFg}}">{{c.note}}</span>
<span style="color: #6B737D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.sample}}</span>
</div>
</sc-for>
</div>
</section>

<div style="flex-shrink: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 16px -32px 0; padding: 0 32px; border-top: 1px solid #E6E8EB">
<div style="display: flex; align-items: center; gap: 8px">
<a href="Client.dc.html" style="height: 36px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; border-radius: 6px; color: #444B55; text-decoration: none; font-size: 14px">Cancel</a>
<a href="NewTemplate2.dc.html" style="height: 36px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 6px; border: 1px solid #D9DCE1; border-radius: 6px; color: #1C2128; text-decoration: none; font-size: 14px"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1C2128" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>Back</a>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="font-size: 13px; color: #5B636E">9 of 10 columns included</span>

<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
</div>
</div>

</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
renderVals() {
const labels = ['Sample file', 'Sheets', 'Columns', 'Rules', 'Default outputs', 'Review'];
const cur = 2;
const steps = labels.map(function (l, i) {
const done = i < cur, now = i === cur;
return {
n: done ? '✓' : String(i + 1), label: l, current: now ? 'step' : 'false', notLast: i < labels.length - 1,
dotBg: now ? '#0E6B6B' : (done ? '#E3F1F0' : '#FFFFFF'), dotFg: now ? '#FFFFFF' : (done ? '#0A4F4F' : '#6B737D'),
dotBorder: now ? '#0E6B6B' : (done ? '#E3F1F0' : '#D9DCE1'),
weight: now ? '500' : '400', fg: now ? '#1C2128' : '#6B737D'
};
});
const c = [
['Invoice No', 'Text', '100% text', 'SGE/26-27/1041, SGE/26-27/1042', true],
['Invoice Date', 'Date', '100% dates · DD-MM-YYYY', '01-10-2026, 02-10-2026', true],
['Customer Name', 'Text', '100% text', 'Ravi Agencies, Om Textiles', true],
['GSTIN', 'Text', '100% text', '27AAFCR1204K1ZQ, 24AACFO7781M1Z2', true],
['Place of Supply', 'Text', '100% text', 'Maharashtra, Gujarat', true],
['Invoice Type', 'Text', '100% text', 'B2B, B2CL', true],
['Taxable Value', 'Number', '99.98% numbers', '18,400.00, 9,250.00', true],
['Tax Amount', 'Number', '100% numbers', '3,312.00, 1,665.00', true],
['Invoice Value', 'Number', '100% numbers', '21,712.00, 10,915.00', true],
['Remarks', 'Text', '91% blank', 'Urgent, (blank)', false]
];
return {
steps: steps,
cols: c.map(function (x) { return { src: x[0], name: x[0], type: x[1], note: x[2], sample: x[3], on: x[4], fg: x[4] ? '#1C2128' : '#8A9199', noteFg: x[2].indexOf('99.98') === 0 ? '#93370D' : '#6B737D' }; })
};
}
}
</script>
