[pytest]
testpaths = tests
norecursedirs = legacy tools .venv build dist _generated
markers =
    spec(*ids): spec items covered by the test
    perf: release-only performance tests (need the P01/P02 pack); A2: run only in phase A2-6
    slow: full-size correctness tests (TPL-R / TPL-N full); each A2 phase runs its own once: pytest -m slow
addopts = -p no:cacheprovider -m "not slow and not perf"
